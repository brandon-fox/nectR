exclude: ^(\.worktrees|\.poodle-temp)/

ci:
  autofix_prs: true
  autofix_commit_msg: "style(pre-commit.ci): auto fixes from pre-commit hooks"
  autoupdate_prs: true
  autoupdate_branch: "chore/pre-commit-autoupdate"
  autoupdate_commit_msg: "chore(deps): pre-commit.ci weekly hook autoupdate"
  autoupdate_schedule: weekly
  submodules: false
  skip:
    - commitizen
    - adrlint-check
    - adrlint-format-and-lock
    - nectr-decisions-check
    - nectr-citations-check
    - nectr-docs-check
    - nectr-spec-links-check
    - mkdocs-build-strict
    - pymarkdown-lint
    - mypy-strict-typecheck
    - nectr-tdd-unit-tests
    - nectr-bdd-behave-precommit
    - nectr-bdd-behave-push
    - nectr-mutation-gate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
        exclude: ^adrlint\.lock$
      - id: trailing-whitespace
        exclude: ^(docs/adr/|adrlint\.lock$)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (OSS secret & entropy scan)
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-jsonschema
        name: check-jsonschema (docs/planning/decisions.yaml)
        files: ^docs/planning/decisions\.(yaml|schema\.json)$
        pass_filenames: false
        args: ["--schemafile", "docs/planning/decisions.schema.json", "docs/planning/decisions.yaml"]
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        name: ruff lint check (src, tests, features)
        args: ["--fix"]
        files: ^(src|tests|features)/
      - id: ruff-format
        name: ruff format check (src, tests, features)
        files: ^(src|tests|features)/

  - repo: local
    hooks:
      - id: forbid-local-paths
        name: Forbid hardcoded user/local/private paths
        entry: '([A-Za-z]:[/\\]Users[/\\]|/(Users|home)/[^/\s]+|\.gemini[/\\]|\.ollama[/\\])'
        language: pygrep
        stages: [pre-commit]

      - id: forbid-mutation-pragmas
        name: Forbid inline mutation suppression pragmas in src
        entry: '#\s*(pragma:\s*no\s+mutate|nomut\b)'
        language: pygrep
        args: ["-i"]
        files: ^src/
        stages: [pre-commit]

      - id: commitizen
        name: commitizen (Conventional Commits check)
        entry: cz check --commit-msg-file
        language: system
        stages: [commit-msg]

      - id: adrlint-check
        name: adrlint MADR 4.0 structure, format & lock check (pre-commit)
        entry: adrlint lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: adrlint-format-and-lock
        name: adrlint format & lock manifest verification (pre-commit)
        entry: python -c "import subprocess, sys; [sys.exit(r.returncode) for r in (subprocess.run(['adrlint', 'format', '--check']), subprocess.run(['adrlint', 'lock', '--check'])) if r.returncode]"
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-decisions-check
        name: nectR MADR Verbosity & Fast Decision Registry Check (pre-commit)
        entry: python -m nectr.devtools.decisions check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-citations-check
        name: nectR Citation Quality & Provenance Lineage Check (pre-commit)
        entry: python -m nectr.devtools.citations check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-docs-check
        name: nectR Living Docs, Glossary & MkDocs Nav Sync Check (pre-commit)
        entry: python -m nectr.devtools.docs_sync check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-spec-links-check
        name: nectR OpenSpec-to-Feature Link Check (pre-commit)
        entry: python -m nectr.devtools.spec_links
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mkdocs-build-strict
        name: mkdocs strict build check (docs, mkdocs.yml)
        entry: mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml$)
        stages: [pre-commit]

      - id: pymarkdown-lint
        name: pymarkdown lint (core docs, README, AGENTS, passing theory docs)
        entry: pymarkdown --config pyproject.toml scan README.md AGENTS.md docs/index.md docs/glossary.md docs/adr docs/planning docs/architecture docs/business docs/theory/biomimicry_model.md docs/theory/provenance_lineage.md
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy-strict-typecheck
        name: mypy (Strict Static Type Check on src, .agents, and skill tests)
        entry: python -m mypy src .agents/lib .agents/skills tests/test_skills_spec.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-tdd-unit-tests
        name: nectR Strict TDD Unit Test Suite (pre-commit)
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-bdd-behave-precommit
        name: nectR Behave BDD Suite excluding @red (pre-commit)
        entry: python -m behave --tags=-red
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-bdd-behave-push
        name: nectR Full Behave BDD Acceptance Suite (pre-push)
        entry: python -m behave
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: nectr-mutation-gate
        name: nectR Tiered Diff-Scoped Mutation Gate (pre-push)
        entry: python -m nectr.devtools.mutation_gate diff
        language: system
        pass_filenames: false
        stages: [pre-push]
