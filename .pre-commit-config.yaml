ci:
  autofix_prs: false
  skip:
    - adrlint-check
    - adrlint-format-and-lock
    - nectr-decisions-check
    - nectr-citations-check
    - nectr-docs-check
    - nectr-spec-links-check
    - pymarkdown-lint

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets-hook
        name: detect-secrets-hook --baseline .secrets.baseline (OSS secret & entropy scan)
        args: ["--baseline", ".secrets.baseline"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        name: ruff check (src, tests, features)
        args: ["src", "tests", "features"]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check (src, tests, features)
        args: ["--check", "src", "tests", "features"]
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-jsonschema
        name: check-jsonschema (docs/planning/decisions.yaml)
        args: ["--schemafile", "docs/planning/decisions.schema.json", "docs/planning/decisions.yaml"]
        pass_filenames: false
        files: ^docs/planning/decisions\.(yaml|schema\.json)$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: forbid-local-paths
        name: Forbid hardcoded user/local/private paths
        entry: '([A-Za-z]:[/\\]Users[/\\]|/(Users|home)/[^/\s]+|\.gemini[/\\]|\.ollama[/\\])'
        language: pygrep
        stages: [pre-commit]

      - id: commitizen
        name: commitizen (Conventional Commits check)
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]

      - id: adrlint-check
        name: adrlint MADR 4.0 structure, format & lock check (pre-commit)
        entry: uv run adrlint lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: adrlint-format-and-lock
        name: adrlint format & lock manifest verification (pre-commit)
        entry: uv run python -c "import subprocess, sys; [sys.exit(r.returncode) for r in (subprocess.run(['adrlint', 'format', '--check']), subprocess.run(['adrlint', 'lock', '--check'])) if r.returncode]"
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-decisions-check
        name: nectR MADR Verbosity & Fast Decision Registry Check (pre-commit)
        entry: uv run python -m nectr.devtools.decisions check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-citations-check
        name: nectR Citation Quality & Provenance Lineage Check (pre-commit)
        entry: uv run python -m nectr.devtools.citations check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-docs-check
        name: nectR Living Docs, Glossary & MkDocs Nav Sync Check (pre-commit)
        entry: uv run python -m nectr.devtools.docs_sync check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: nectr-spec-links-check
        name: nectR OpenSpec-to-Feature Link Check (pre-commit)
        entry: uv run python -m nectr.devtools.spec_links
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pymarkdown-lint
        name: pymarkdown lint (core docs, README, AGENTS, passing theory docs)
        entry: uv run pymarkdown --config pyproject.toml scan README.md AGENTS.md docs/index.md docs/glossary.md docs/adr docs/planning docs/architecture docs/business docs/theory/biomimicry_model.md docs/theory/provenance_lineage.md
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mkdocs-build-strict
        name: mkdocs strict build check (pre-push)
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: mypy-strict-typecheck
        name: mypy (Strict Static Type Check on src, .agents, and skill tests)
        entry: uv run python -m mypy src .agents/lib .agents/skills tests/test_skills_spec.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: nectr-tdd-unit-tests
        name: nectR Strict TDD Unit Test Suite (pre-push)
        entry: uv run python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: nectr-bdd-behave-push
        name: nectR Behave BDD Acceptance Suite excluding @red (pre-push)
        entry: uv run python -m behave --tags=-red
        language: system
        pass_filenames: false
        stages: [pre-push]
