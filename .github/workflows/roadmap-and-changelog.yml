name: Automated Changelog & OpenSpec Roadmap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changelog-and-openspec-summary:
    name: Generate Changelog & OpenSpec Feature Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint

      - name: Install locked lint dependencies
        run: uv sync --frozen --extra lint

      - name: Generate Conventional Commits changelog
        run: uv run cz changelog --dry-run > CHANGELOG.generated.md

      - name: Summarize OpenSpec specs & active changes
        run: |
          {
            echo "# nectR Automated Feature & Spec Status"
            echo ""
            echo "## Active Specs"
            find openspec/specs -name "spec.md" | sort | sed 's/^/- /'
            echo ""
            echo "## Active OpenSpec Changes"
            find openspec/changes -maxdepth 2 -not -path "openspec/changes/archive/*" -name "tasks.md" | sort | sed 's/^/- /'
          } > openspec-roadmap.md

      - name: Upload changelog & roadmap artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-and-changelog
          path: |
            CHANGELOG.generated.md
            openspec-roadmap.md
          retention-days: 30
