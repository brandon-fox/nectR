name: Tiered Mutation Testing Gate

on:
  schedule:
    # Nightly full sweep at 07:00 UTC
    - cron: "0 7 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mutation-gate:
    name: Poodle Tiered Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: mutation

      - name: Install locked project and dev dependencies
        run: uv sync --frozen --extra dev

      - name: Reject inline mutation suppression pragmas
        run: uv run python -m nectr.devtools.mutation_gate check-pragmas

      - name: Run changed-line mutation gate (PRs)
        if: github.event_name == 'pull_request'
        run: |
          uv run python -m nectr.devtools.mutation_gate diff --base "origin/${{ github.base_ref }}" --report mutation-report.json

      - name: Run full bounded-context mutation sweep (push / schedule / manual)
        if: github.event_name != 'pull_request'
        run: |
          uv run python -m nectr.devtools.mutation_gate full --report mutation-report.json

      - name: Upload mutation testing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-testing-report
          path: mutation-report.json
          if-no-files-found: ignore
          retention-days: 30
