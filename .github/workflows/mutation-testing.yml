name: Tiered Mutation Testing Gate

on:
  schedule:
    # Nightly full sweep at 07:00 UTC
    - cron: "0 7 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-gate:
    name: Poodle Tiered Mutation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reject inline mutation suppression pragmas
        run: python -m nectr.devtools.mutation_gate check-pragmas

      - name: Run changed-line mutation gate (PRs)
        if: github.event_name == 'pull_request'
        run: |
          python -m nectr.devtools.mutation_gate diff --base "origin/${{ github.base_ref }}" --report mutation-report.json

      - name: Run full bounded-context mutation sweep (push / schedule / manual)
        if: github.event_name != 'pull_request'
        run: |
          python -m nectr.devtools.mutation_gate full --report mutation-report.json

      - name: Upload mutation testing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-report
          path: mutation-report.json
          if-no-files-found: ignore
          retention-days: 30
