[project]
name = "nectr"
version = "0.1.0"
description = "nectR: Federated Biomimetic Campus Tutoring Private Blockchain, Smart Contracts, Service Layer & Agent-Based Behavioral Economy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "nectR Research & Architecture" }
]
dependencies = [
    "pydantic>=2.7.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "canonicaljson>=2.0.0",
    "remerkleable>=0.1.28",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "opentelemetry-sdk>=1.25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "behave>=1.2.6",
    "hypothesis>=6.100.0",
    "poodle>=1.4.0",
]
lint = [
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-networkx>=3.6.1",
    "pymarkdownlnt>=0.9.42",
    "adrlint>=0.5.2",
    "pre-commit>=3.7.0",
    "commitizen>=4.0.0",
    "check-jsonschema>=0.29.0",
]
security = [
    "detect-secrets>=1.5.0",
    "pip-licenses>=5.0.0",
    "pip-audit>=2.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
research = [
    "matplotlib>=3.9.0",
    "scipy>=1.13.0",
    "pandas>=2.2.2",
    "mesa>=3.0.0",
]
ui = [
    "streamlit>=1.36.0",
]
dev = [
    "nectr[test,lint,security,docs,research,ui]",
]

[project.scripts]
nectr-decisions = "nectr.devtools.decisions:main"
nectr-citations = "nectr.devtools.citations:main"
nectr-docs = "nectr.devtools.docs_sync:main"
nectr-ci-parity = "nectr.devtools.ci_parity:main"
nectr-mutation = "nectr.devtools.mutation_gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".worktrees", ".git", ".venv", ".poodle-temp"]
addopts = "-ra -q --strict-markers"
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".worktrees", ".poodle-temp"]

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.md013.enabled = false
plugins.md033.enabled = false
plugins.md036.enabled = false
plugins.md041.enabled = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
explicit_package_bases = true

[tool.uv]
constraint-dependencies = [
    "setuptools>=78.1.1",
]

[tool.poodle]
source_folders = ["src"]
skip_mutators = ["String"]
min_timeout = 10
timeout_multiplier = 5
work_folder = ".poodle-temp"

[tool.poodle.runner_opts]
command_line = "pytest -x --assert=plain -o pythonpath=."

[tool.poodle.reporter_opts]
json_report_found = true

[tool.nectr.mutation]
engine = "poodle"
per_mutant_timeout_seconds = 10
excluded = ["src/nectr/personas", "src/nectr/ui", "experiments"]

[tool.nectr.mutation.tiers]
"src/nectr/contracts" = 85.0
"src/nectr/chain" = 85.0
"src/nectr/services" = 75.0
"src/nectr/devtools" = 75.0

[tool.nectr.mutation.baseline]
"src/nectr/contracts" = 77.0
"src/nectr/chain" = 85.0
"src/nectr/services" = 41.0
"src/nectr/devtools" = 57.0
